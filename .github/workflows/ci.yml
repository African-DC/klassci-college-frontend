name: CI — Frontend

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm tsc --noEmit

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: https://college.klassci.com/api-be
      NEXT_PUBLIC_EXTRA_ALLOWED_HOSTS: ""
      NEXTAUTH_SECRET: ci-secret-not-real
      NEXTAUTH_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package Windows production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar czf standalone.tgz -C .next/standalone .

      - name: Upload Windows production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: klassci-college-frontend-${{ github.sha }}
          path: standalone.tgz
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --coverage --passWithNoTests
